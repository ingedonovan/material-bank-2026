<!doctype html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Display — Future Assemblies Material Bank</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/display.css">
  <script src="../assets/js/config.js"></script>
  <script src="../assets/vendor/papaparse.min.js"></script>

</head>
<body class="page-display">
  <header class="display-bar">
    <a class="wordmark" href="../index.html"><img class="logo" src="../assets/img/fa-logo.png" alt="Future Assemblies"><span>Material Bank</span></a>
    <nav>
      <a href="../index.html">Index</a>
      <span class="here">Display</span>
      <button type="button" id="fs" title="Full screen (F)">Full screen</button>
    </nav>
  </header>

  <div id="space" aria-label="Floating field of materials currently in use">
    <svg id="links" aria-hidden="true"></svg>

  <div id="card" class="dcard" hidden></div>

  </p>

  <script src="../assets/js/display.js"></script>
